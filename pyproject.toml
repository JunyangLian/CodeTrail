[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico"
version = "0.1.0"
description = "CodeTrail local coding workbench, based on Pico"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codetrail = "pico.cli:main"
codetrail-web = "pico.web:main"
pico = "pico.cli:main"
pico-web = "pico.web:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.setuptools.package-data]
pico = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
