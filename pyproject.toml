[project]
name = "genomeqc-agent"
version = "0.1.0"
description = "GenomeQC Agent (AssemblyGenomics-Copilot V3): interactive organelle genome QC agent with evidence-grounded read-only tools."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint-sqlite>=2,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.66.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomeqc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
norecursedirs = ["examples", "src", "docs", "scripts", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# V2 snapshot files stay byte-identical to the audited originals: never lint-fix them.
extend-exclude = ["src/genomeqc_agent/adapters/v2_snapshot"]
